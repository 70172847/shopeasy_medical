<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Store - Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">⚕️ MediCare Store</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Medical Supplies</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <button id="theme-toggle">Dark Mode</button>
    </nav>
  </header>

  <main>
    <div id="status-msg"></div>
    
    <section class="controls">
      <input type="text" id="search-input" placeholder="Search medical equipment...">
      <select id="category-select">
        <option value="all">All Categories</option>
        <option value="diagnostic">Diagnostic Tools</option>
        <option value="monitoring">Monitoring Devices</option>
        <option value="supplies">General Supplies</option>
        <option value="care">Patient Care</option>
      </select>
      <select id="sort-select">
        <option value="default">Sort by</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </section>

    <section>
      <h2>Medical Product Catalog</h2>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 MediCare Direct. Quality Healthcare Solutions.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
